name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma's config requires a URL even for `prisma generate`; jobs that need a database override it.
  DATABASE_URL: postgresql://tsevedi:tsevedi@localhost:5432/tsevedi?schema=public

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tsevedi
          POSTGRES_PASSWORD: tsevedi
          POSTGRES_DB: tsevedi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tsevedi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_PASSWORD: ci-admin-password
      SESSION_SECRET: ci-session-secret-that-is-long-enough-123
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DISABLE_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
